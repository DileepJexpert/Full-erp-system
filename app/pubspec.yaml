name: business_manager
description: Multi-tenant business operations platform for Flutter
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.0

  # Networking
  dio: ^5.4.3+1

  # Local Database
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.21
  path_provider: ^2.1.3
  path: ^1.9.0

  # Bluetooth Printing
  flutter_blue_plus: ^1.32.8
  esc_pos_utils: ^1.1.0

  # GPS
  geolocator: ^12.0.0

  # Camera
  image_picker: ^1.1.2
  image_cropper: ^7.1.0

  # Notifications
  firebase_core: ^2.31.0
  firebase_messaging: ^14.9.1

  # Storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3

  # Network
  connectivity_plus: ^6.0.3

  # Charts
  fl_chart: ^0.68.0

  # UI
  qr_flutter: ^4.1.0
  intl: ^0.19.0
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  cached_network_image: ^3.3.1

  # PDF
  pdf: ^3.11.0
  printing: ^5.12.0

  # Files
  file_picker: ^8.0.3

  # Utils
  uuid: ^4.4.0
  json_annotation: ^4.9.0
  freezed_annotation: ^2.4.1
  equatable: ^2.0.5
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  json_serializable: ^6.8.0
  freezed: ^2.5.2
  riverpod_generator: ^2.4.0
  drift_dev: ^2.18.0
  mockito: ^5.4.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/fonts/

  generate: true
